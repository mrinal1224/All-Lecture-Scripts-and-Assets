<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Rating Component</title>
  </head>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .rating {
      text-align: center;
    }

    .star, .clear-rating {
      font-size: 24px;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .star.filled {
      color: gold;
    }

    .clear-rating {
      font-size: 18px; /* Make the clear button slightly smaller or distinguishable */
    }
  </style>
  <body>
    <div class="rating">
      <!-- Option to clear the rating -->
      <div class="clear-rating" data-value="0">Clear Rating</div>
      <!-- Display five stars -->
      <span id="stars">
        <span class="star" data-value="1">&#9733;</span>
        <span class="star" data-value="2">&#9733;</span>
        <span class="star" data-value="3">&#9733;</span>
        <span class="star" data-value="4">&#9733;</span>
        <span class="star" data-value="5">&#9733;</span>
      </span>
      <!-- Display the current rating -->
      <p>Rating: <span id="rating">0</span>/5</p>
    </div>
    <script>
      const stars = document.querySelectorAll(".star");
      const ratingDisplay = document.getElementById("rating");
      const clearRating = document.querySelector(".clear-rating");

      // Listen for clicks on the stars
      stars.forEach((star) => {
        star.addEventListener("click", function() {
          const value = parseInt(this.getAttribute("data-value"));
          updateRating(value);
        });
      });

      // Listen for click on the clear rating button
      clearRating.addEventListener("click", function() {
        updateRating(0);
      });

      function updateRating(value) {
        stars.forEach((star) => {
          const starValue = parseInt(star.getAttribute("data-value"));
          star.classList.toggle("filled", starValue <= value);
        });
        ratingDisplay.textContent = value;
      }
    </script>
  </body>
</html>
