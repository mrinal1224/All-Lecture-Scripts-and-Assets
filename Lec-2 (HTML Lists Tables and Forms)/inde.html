<!DOCTYPE html>
<html>
  <head>
    <title>Table Examples</title>
  </head>
  <body>
    <table border style="text-align: center">
      <caption>
        Student's Marksheet
      </caption>
      <thead>
        <th>Serial</th>
        <th>Name</th>
        <th>Roll No.</th>
        <th>Marks</th>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Mrinal</td>
          <td>2016911</td>
          <td>78</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Aman</td>
          <td>2015911</td>
          <td>98</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Adam</td>
            <td>2015993</td>
            <td>65</td>
          </tr>
          <tr>
            <td>4</td>
            <td>Steve</td>
            <td>2015756</td>
            <td>68</td>
          </tr>
      </tbody>
    </table>
  </body>
</html>
